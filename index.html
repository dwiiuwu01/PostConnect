<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>PostConnect</h1>
        <p class="subtitle">Connect your TikTok account and post your content.</p>

        <div class="card">
            <h2>Post to TikTok</h2>

            <button class="login-button" onclick="loginTikTok()">
                Login with TikTok
            </button>

            <p id="login-status"></p>

            <div class="form">
                <label>Caption</label>
                <textarea id="caption" placeholder="Write your caption..."></textarea>

                <label>Video</label>
                <input id="video" type="file" accept="video/mp4">

                <div id="creator-section" style="display: none;">
                    <p id="creator-name"></p>

                    <label>Who can view this video?</label>
                    <select id="privacy">
                        <option value="">Select privacy</option>
                    </select>

                    <label>
                        <input type="checkbox" id="allow-comment">
                        Allow Comment
                    </label>

                    <label>
                        <input type="checkbox" id="allow-duet">
                        Allow Duet
                    </label>

                    <label>
                        <input type="checkbox" id="allow-stitch">
                        Allow Stitch
                    </label>

                    <label>
                        <input type="checkbox" id="consent">
                        I agree to send this video to TikTok.
                    </label>
                </div>

                <button class="post-button" onclick="postToTikTok()">
                    Post to TikTok
                </button>

                <p id="status"></p>
            </div>
        </div>

        <div class="links">
            <a href="terms.html">Terms of Service</a>
            <span>|</span>
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>

    <script>
        let accessToken = sessionStorage.getItem("tiktok_access_token");

        function loginTikTok() {
            window.location.href = "/api/login";
        }

        const params = new URLSearchParams(window.location.search);
        const tokenFromUrl = params.get("access_token");

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;

            sessionStorage.setItem(
                "tiktok_access_token",
                accessToken
            );

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }

        if (accessToken) {
            document.getElementById("login-status").textContent =
                "TikTok account connected.";

            loadCreatorInfo();
        }

        async function loadCreatorInfo() {
            const creatorSection =
                document.getElementById("creator-section");

            const creatorName =
                document.getElementById("creator-name");

            const privacy =
                document.getElementById("privacy");

            const comment =
                document.getElementById("allow-comment");

            const duet =
                document.getElementById("allow-duet");

            const stitch =
                document.getElementById("allow-stitch");

            try {
                const response = await fetch("/api/creator", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${accessToken}`
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    document.getElementById("status").textContent =
                        result.error?.message ||
                        result.error ||
                        JSON.stringify(result);

                    return;
                }

                const data = result.data;

                creatorName.textContent =
                    "TikTok account: @" + data.creator_username;

                privacy.innerHTML =
                    '<option value="">Select privacy</option>';

                data.privacy_level_options.forEach(option => {
                    const item = document.createElement("option");

                    item.value = option;
                    item.textContent = formatPrivacy(option);

                    privacy.appendChild(item);
                });

                if (data.comment_disabled) {
                    comment.disabled = true;
                }

                if (data.duet_disabled) {
                    duet.disabled = true;
                }

                if (data.stitch_disabled) {
                    stitch.disabled = true;
                }

                creatorSection.style.display = "block";

            } catch (error) {
                document.getElementById("status").textContent =
                    "Failed to load TikTok creator information.";
            }
        }

        function formatPrivacy(value) {
            const names = {
                PUBLIC_TO_EVERYONE: "Everyone",
                MUTUAL_FOLLOW_FRIENDS: "Friends",
                FOLLOWER_OF_CREATOR: "Followers",
                SELF_ONLY: "Only me"
            };

            return names[value] || value;
        }

        async function postToTikTok() {
            const videoInput =
                document.getElementById("video");

            const caption =
                document.getElementById("caption").value;

            const privacy =
                document.getElementById("privacy").value;

            const allowComment =
                document.getElementById("allow-comment").checked;

            const allowDuet =
                document.getElementById("allow-duet").checked;

            const allowStitch =
                document.getElementById("allow-stitch").checked;

            const consent =
                document.getElementById("consent").checked;

            const status =
                document.getElementById("status");

            if (!accessToken) {
                status.textContent =
                    "Please login with TikTok first.";
                return;
            }

            if (!videoInput.files.length) {
                status.textContent =
                    "Please select a video.";
                return;
            }

            if (!privacy) {
                status.textContent =
                    "Please select a privacy option.";
                return;
            }

            if (!consent) {
                status.textContent =
                    "Please agree before posting.";
                return;
            }

            const file = videoInput.files[0];

            if (file.type !== "video/mp4") {
                status.textContent =
                    "Please select an MP4 video.";
                return;
            }

            status.textContent =
                "Uploading video to TikTok...";

            try {
                const reader = new FileReader();

                reader.onload = async function () {
                    try {
                        const base64Video =
                            reader.result.split(",")[1];

                        const response = await fetch("/api/upload", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${accessToken}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                video: base64Video,
                                caption: caption,
                                privacy_level: privacy,
                                disable_comment: !allowComment,
                                disable_duet: !allowDuet,
                                disable_stitch: !allowStitch
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            status.textContent =
                                data.error?.message ||
                                data.error ||
                                JSON.stringify(data);

                            console.error(data);
                            return;
                        }

                        status.textContent =
                            "Video berhasil dikirim ke TikTok!";

                    } catch (error) {
                        console.error(error);

                        status.textContent =
                            "Something went wrong while uploading.";
                    }
                };

                reader.readAsDataURL(file);

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Something went wrong while uploading.";
            }
        }
    </script>

</body>
</html>
