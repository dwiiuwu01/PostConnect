<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>PostConnect</h1>
        <p class="subtitle">Connect your TikTok account and post your content.</p>

        <div class="card">
            <h2>Post to TikTok</h2>

            <button class="login-button" onclick="loginTikTok()">
                Login with TikTok
            </button>

            <p id="login-status"></p>

            <div class="form">
                <label>Caption</label>
                <textarea id="caption" placeholder="Write your caption..."></textarea>

                <label>Video</label>
                <input id="video" type="file" accept="video/mp4">

                <button class="post-button" onclick="postToTikTok()">
                    Post to TikTok
                </button>

                <p id="status"></p>
            </div>
        </div>

        <div class="links">
            <a href="terms.html">Terms of Service</a>
            <span>|</span>
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>

    <script>
        let accessToken = sessionStorage.getItem("tiktok_access_token");

        function loginTikTok() {
            window.location.href = "/api/login";
        }

        const params = new URLSearchParams(window.location.search);
        const tokenFromUrl = params.get("access_token");

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;

            sessionStorage.setItem(
                "tiktok_access_token",
                accessToken
            );

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }

        if (accessToken) {
            document.getElementById("login-status").textContent =
                "TikTok account connected.";
        }

        async function postToTikTok() {
            const videoInput = document.getElementById("video");
            const caption = document.getElementById("caption").value;
            const status = document.getElementById("status");

            if (!accessToken) {
                status.textContent = "Please login with TikTok first.";
                return;
            }

            if (!videoInput.files.length) {
                status.textContent = "Please select a video.";
                return;
            }

            const file = videoInput.files[0];

            if (file.type !== "video/mp4") {
                status.textContent = "Please select an MP4 video.";
                return;
            }

            status.textContent = "Uploading video to TikTok...";

            try {
                const reader = new FileReader();

                reader.onload = async function () {
                    const base64Video =
                        reader.result.split(",")[1];

                    const response = await fetch("/api/upload", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${accessToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            video: base64Video,
                            caption: caption
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        status.textContent =
                            data.error || "Upload failed.";
                        console.error(data);
                        return;
                    }

                    status.textContent =
                        "Video berhasil dikirim ke TikTok!";
                };

                reader.readAsDataURL(file);

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Something went wrong while uploading.";
            }
        }
    </script>

</body>
</html>
