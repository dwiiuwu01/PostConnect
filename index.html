<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>PostConnect</h1>
        <p class="subtitle">Connect your TikTok account and post your content.</p>

        <div class="card">
            <h2>Post to TikTok</h2>

            <button class="login-button">
                Login with TikTok
            </button>

            <div class="form">
                <label>Caption</label>
                <textarea placeholder="Write your caption..."></textarea>

                <label>Video</label>
                <input type="file" accept="video/*">

                <button class="post-button">
                    Post to TikTok
                </button>
            </div>
        </div>

        <div class="links">
            <a href="terms.html">Terms of Service</a>
            <span>|</span>
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>

</body>
</html>
